name: Routing review diagnostics
on:
  push:
    branches: [codex/routing-ci-comparison]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  environment:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            revision: 6c8c7ad93f1a66067c22bff382b9ddcf306294cd
          - label: candidate
            revision: aed298d08c844e4c48fb5f4451012d8029fe18d8
          - label: merge
            revision: e787118f51cf87cef1d007bde36f3f8735d96bb1
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci@sha256:c3c20d625bcc9f75e50c3c2c2b75c88d3e60a3f4352b0f19f5327b490438722d
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-inputs
          persist-credentials: false
      - name: Capture startup with no frontend dependencies
        run: |
          mkdir -p ci-out
          python3 diagnostic-inputs/.github/diagnostics/mock-startup.py | tee ci-out/before-cleanup.json
          sha256sum scripts/mock-api-server.mjs scripts/mock-api-core.mjs > ci-out/mock-hashes.txt
          { command -v node; command -v cargo; readlink -f "$(command -v cargo)"; rustup show active-toolchain; } > ci-out/toolchain.txt 2>&1
      - name: Apply canonical hosted disk cleanup
        run: |
          rm -rf /__t/* || true
          df -h /__w || true
      - name: Capture startup after canonical hosted cleanup
        run: python3 diagnostic-inputs/.github/diagnostics/mock-startup.py | tee ci-out/after-cleanup.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: review-environment-${{ matrix.label }}
          path: ci-out/
          retention-days: 14
