name: PR 7037 pinned Linux follow-up
on:
  push:
    branches:
      - codex/routing-ci-comparison
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-validation:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci@sha256:c3c20d625bcc9f75e50c3c2c2b75c88d3e60a3f4352b0f19f5327b490438722d
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_MIN_STACK: '67108864'
      LLVM_PROFILE_FILE_NAME: openhuman-%8m.profraw
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '7037'
      SOURCE_BASE: '7578346c85973c61afbfe6e24d88eb0a174ba014'
      COMPARE_BASE: '7578346c85973c61afbfe6e24d88eb0a174ba014'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7578346c85973c61afbfe6e24d88eb0a174ba014
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-inputs
          persist-credentials: false
      - name: Prepare exact source and canonical dependencies
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$SOURCE_BASE"
          git cat-file -e "$COMPARE_BASE^{commit}"
          bash scripts/ci/checkout-submodules.sh
          pnpm install --frozen-lockfile
          mkdir -p ci-out/lcov
          git rev-parse HEAD > ci-out/source-base.txt
          printf 'RUSTUP_HOME=%s\nCARGO_HOME=%s\nHOME=%s\n' "$RUSTUP_HOME" "$CARGO_HOME" "$HOME" > ci-out/rust-homes.txt
          rustc -V > ci-out/rustc-version.txt
          cargo -V > ci-out/cargo-version.txt
          sha256sum "diagnostic-inputs/.github/diagnostics/pr7037-followup.patch" "diagnostic-inputs/.github/diagnostics/pr7037-source-hashes.txt" "diagnostic-inputs/.github/diagnostics/pr7037-rust-source-files.txt" > ci-out/diagnostic-input-hashes.txt
          git apply --check "diagnostic-inputs/.github/diagnostics/pr7037-followup.patch"
          git apply "diagnostic-inputs/.github/diagnostics/pr7037-followup.patch"
          while read -r digest source_path; do
            if ! git ls-files --error-unmatch "$source_path" >/dev/null 2>&1; then
              git add --intent-to-add -- "$source_path"
            fi
          done < "diagnostic-inputs/.github/diagnostics/pr7037-source-hashes.txt"
          git diff --check
          git diff --full-index --binary > ci-out/applied.patch
          cmp ci-out/applied.patch "diagnostic-inputs/.github/diagnostics/pr7037-followup.patch"
          cp "diagnostic-inputs/.github/diagnostics/pr7037-source-hashes.txt" ci-out/source-hashes.txt
          sha256sum -c "diagnostic-inputs/.github/diagnostics/pr7037-source-hashes.txt"
          test -f "diagnostic-inputs/.github/diagnostics/pr7037-rust-source-files.txt"
          git diff --name-only -- '*.rs' | sort > ci-out/changed-rust-files.txt
          pnpm rust:layout
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ci-fast-rust-cov
          cache-on-failure: false
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install canonical test modules
        run: bash scripts/ci/self-hosted/install-test-modules.sh "/opt/openhuman-test-modules/${GITHUB_RUN_ID}-pr7037" ci-out/test-modules.env
      - name: Reproduce non-UTF8 regression on published production source
        run: |
          set -euo pipefail
          set -a
          source ci-out/test-modules.env
          set +a
          unset RUSTFLAGS
          cp crates/openhuman-core/src/sandbox/ops.rs ci-out/fixed-ops.rs
          cp crates/openhuman-core/src/sandbox/grants.rs ci-out/fixed-grants.rs
          cp diagnostic-inputs/.github/diagnostics/pr7037-before-ops.rs crates/openhuman-core/src/sandbox/ops.rs
          cp diagnostic-inputs/.github/diagnostics/pr7037-before-grants.rs crates/openhuman-core/src/sandbox/grants.rs
          sha256sum crates/openhuman-core/src/sandbox/ops.rs crates/openhuman-core/src/sandbox/grants.rs > ci-out/non-utf8-before-source-hashes.txt
          FEATURES="$(bash scripts/ci/product-features.sh)"
          set +e
          bash scripts/ci-cancel-aware.sh cargo test --features "$FEATURES" -p openhuman --lib -- non_utf8 --test-threads=1 2>&1 | tee ci-out/non-utf8-before.log
          before_status=${PIPESTATUS[0]}
          set -e
          cp ci-out/fixed-ops.rs crates/openhuman-core/src/sandbox/ops.rs
          cp ci-out/fixed-grants.rs crates/openhuman-core/src/sandbox/grants.rs
          test "$before_status" -ne 0
          grep -Eq 'test result: FAILED\. .* [1-9][0-9]* failed;' ci-out/non-utf8-before.log
          if grep -Eq 'error\[E[0-9]+' ci-out/non-utf8-before.log; then exit 1; fi
          sha256sum -c ci-out/source-hashes.txt
      - name: Clear coverage and run scoped Rust regressions
        run: bash scripts/ci-cancel-aware.sh cargo llvm-cov clean --workspace
      - name: Run actual agent shell E2E and all sandbox regressions
        env:
          SANDBOX_FILTER: "sandboxed_shell_forwards_host_toolchain_homes_and_confines_writes"
        run: |
          set -euo pipefail
          set -a
          source ci-out/test-modules.env
          set +a
          unset RUSTFLAGS
          FEATURES="$(bash scripts/ci/product-features.sh)"
          if [ -n "$SANDBOX_FILTER" ]; then
            bash scripts/ci-cancel-aware.sh cargo llvm-cov --features "$FEATURES" --no-report -p openhuman-cli --test agent_harness_e2e -- "$SANDBOX_FILTER" --test-threads=1 2>&1 | tee ci-out/agent-harness-e2e.log
          else
            bash scripts/ci-cancel-aware.sh cargo llvm-cov --features "$FEATURES" --no-report -p openhuman-cli --test agent_harness_e2e -- --test-threads=1 2>&1 | tee ci-out/agent-harness-e2e.log
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' ci-out/agent-harness-e2e.log
          bash scripts/ci-cancel-aware.sh cargo llvm-cov --features "$FEATURES" --no-report -p openhuman --lib -- sandbox:: --test-threads=1 2>&1 | tee ci-out/sandbox-tests.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed;' ci-out/sandbox-tests.log
      - name: Whole-workspace Rust formatting
        run: |
          set -euo pipefail
          bash scripts/ci-cancel-aware.sh cargo fmt --all --check 2>&1 | tee ci-out/full-rust-format.log
          bash scripts/ci-cancel-aware.sh cargo fmt --manifest-path crates/openhuman-app/Cargo.toml --all --check 2>&1 | tee ci-out/tauri-rust-format.log
      - name: Core Clippy with warnings denied
        run: |
          set -euo pipefail
          set -a
          source ci-out/test-modules.env
          set +a
          unset RUSTFLAGS
          FEATURES="$(bash scripts/ci/product-features.sh)"
          bash scripts/ci-cancel-aware.sh cargo clippy --features "$FEATURES" -p openhuman --lib -- -D warnings 2>&1 | tee ci-out/core-clippy.log
      - name: Collect Rust LCOV and normalize source paths
        run: |
          set -euo pipefail
          bash scripts/ci-cancel-aware.sh cargo llvm-cov report --lcov --output-path ci-out/lcov/lcov-core.info
          sed -i 's|/__w/openhuman/openhuman/||g' ci-out/lcov/lcov-core.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr7037-followup-linux
          path: ci-out/
          retention-days: 14

  changed-line-coverage:
    runs-on: ubuntu-22.04
    needs: native-validation
    if: needs.native-validation.result == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7578346c85973c61afbfe6e24d88eb0a174ba014
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-inputs
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr7037-followup-linux
          path: measured
      - name: Prove the measured source and input patch match
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7578346c85973c61afbfe6e24d88eb0a174ba014'
          git apply --check diagnostic-inputs/.github/diagnostics/pr7037-followup.patch
          git apply diagnostic-inputs/.github/diagnostics/pr7037-followup.patch
          while read -r digest source_path; do
            if ! git ls-files --error-unmatch "$source_path" >/dev/null 2>&1; then
              git add --intent-to-add -- "$source_path"
            fi
          done < diagnostic-inputs/.github/diagnostics/pr7037-source-hashes.txt
          git diff --check
          git diff --full-index --binary > measured-reapplied.patch
          cmp measured-reapplied.patch diagnostic-inputs/.github/diagnostics/pr7037-followup.patch
          sha256sum -c diagnostic-inputs/.github/diagnostics/pr7037-source-hashes.txt
          cmp measured/source-hashes.txt diagnostic-inputs/.github/diagnostics/pr7037-source-hashes.txt
          test "$(cat measured/source-base.txt)" = '7578346c85973c61afbfe6e24d88eb0a174ba014'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install diff-cover on the hosted runner
        run: pip install 'diff-cover>=9.2.0'
      - name: Require changed production Rust files in LCOV
        run: |
          set -euo pipefail
          mapfile -t changed_production_rust < <(sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' diagnostic-inputs/.github/diagnostics/pr7037-rust-source-files.txt)
          if [ "${#changed_production_rust[@]}" -gt 0 ]; then
            bash scripts/ci/assert-coverage-presence.sh measured/lcov/lcov-core.info --files "${changed_production_rust[@]}"
          else
            echo 'No changed production Rust source paths in the supplied roster.'
          fi
      - name: Enforce >= 80 percent changed-line coverage against full PR base
        run: bash scripts/ci/self-hosted/diff-cover.sh measured/lcov '7578346c85973c61afbfe6e24d88eb0a174ba014' ci-out/diff-cover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr7037-followup-linux-coverage
          path: ci-out/
          retention-days: 14
