name: Routing baseline comparison
on:
  push:
    branches: [codex/routing-ci-comparison]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    if: ${{ !contains(github.event.head_commit.message, 'coverage reports only') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            revision: d0d1e51eaed715dce78e332f84010784aead84a0
          - label: candidate
            revision: 964e79ab91a01e4684046e064b4a7122422ec637
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci@sha256:c3c20d625bcc9f75e50c3c2c2b75c88d3e60a3f4352b0f19f5327b490438722d
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_MIN_STACK: '67108864'
      OH_COV_DOCTESTS: '0'
      OH_COV_TUI: '0'
      OUT: ci-out/lcov/lcov-core.info
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: SayrWolfridge/openhuman
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Initialize canonical submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/ci/checkout-submodules.sh
      - name: Record exact inputs
        run: |
          mkdir -p ci-out/lcov
          { git rev-parse HEAD; rustc -V; cargo -V; git submodule status --recursive; } > ci-out/inputs.txt
      - name: Linux TLS lockfile policy
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/check-linux-tls-dependencies.sh 2>&1 | tee ci-out/tls.log
      - name: Module pins
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/ci/fetch-submodule-tags.sh
          node scripts/ci/check-module-pins.mjs 2>&1 | tee ci-out/pins.log
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install canonical test modules
        run: |
          bash scripts/ci/self-hosted/install-test-modules.sh "/opt/openhuman-test-modules/${GITHUB_RUN_ID}-${{ matrix.label }}" ci-out/test-modules.env
          find "/opt/openhuman-test-modules/${GITHUB_RUN_ID}-${{ matrix.label }}" -name '*.so' -exec sha256sum {} + > ci-out/module-hashes.txt
      - name: Canonical Rust coverage suite
        continue-on-error: true
        run: |
          set -o pipefail
          set -a
          source ci-out/test-modules.env
          set +a
          bash scripts/ci/rust-coverage.sh 2>&1 | tee ci-out/rust.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: comparison-${{ matrix.label }}
          path: ci-out/
          retention-days: 14
          if-no-files-found: warn

  coverage-report:
    if: contains(github.event.head_commit.message, 'coverage reports only')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 964e79ab91a01e4684046e064b4a7122422ec637
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: comparison-candidate
          run-id: 37211888605
          github-token: ${{ github.token }}
          path: coverage-inputs/rust
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ci-out-checks
          run-id: 37156066640
          repository: tinyhumansai/openhuman
          github-token: ${{ github.token }}
          path: coverage-inputs/frontend
      - name: Verify unchanged frontend sources since coverage run
        run: git diff --exit-code e4b823d394637d41018af4422766a1abe21b30f2 HEAD -- app/
      - name: Install canonical coverage tool
        run: python -m pip install 'diff-cover>=9.2.0'
      - name: Measure changed-line coverage
        run: |
          find coverage-inputs -type f -name '*.info' -exec sed -i 's|/__w/openhuman/openhuman/||g' {} +
          bash scripts/ci/self-hosted/diff-cover.sh coverage-inputs d0d1e51eaed715dce78e332f84010784aead84a0 diff-cover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: routing-diff-coverage
          path: diff-cover/
          retention-days: 14
