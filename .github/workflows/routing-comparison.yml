name: Routing lint coverage
on:
  push:
    branches: [codex/routing-ci-comparison]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coverage-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 89ed4c91de5dc70bb37f84e537931208e20ccafd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-inputs
          persist-credentials: false
      - name: Apply validated source with documentation follow-up
        run: |
          git apply --check diagnostic-inputs/.github/diagnostics/round3-final.patch
          git apply diagnostic-inputs/.github/diagnostics/round3-final.patch
          git diff --check
          mkdir -p coverage-inputs/frontend
          cp diagnostic-inputs/.github/diagnostics/review-frontend-lcov.info coverage-inputs/frontend/lcov.info
          cp diagnostic-inputs/.github/diagnostics/review-frontend-results.txt coverage-inputs/frontend/results.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: routing-round2-rust
          run-id: 37375560509
          github-token: ${{ github.token }}
          path: coverage-inputs/rust
      - name: Install canonical coverage tool
        run: python3 -m pip install 'diff-cover>=9.2.0'
      - name: Run canonical changed-line coverage gate
        run: |
          find coverage-inputs -type f -name '*.info' -exec sed -i 's|/__w/openhuman/openhuman/||g' {} +
          bash scripts/ci/self-hosted/diff-cover.sh coverage-inputs 6c8c7ad93f1a66067c22bff382b9ddcf306294cd diff-cover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: routing-round3-coverage
          path: |
            diff-cover/
            coverage-inputs/frontend/
          retention-days: 14
