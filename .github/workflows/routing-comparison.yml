name: Sandbox Rust homes verification
on:
  push:
    branches: [codex/routing-ci-comparison]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  changed-line-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6c8c7ad93f1a66067c22bff382b9ddcf306294cd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-inputs
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-rust-homes
          run-id: 37507508324
          github-token: ${{ github.token }}
          path: measured
      - name: Match tested Rust sources and compute exact changed-line coverage
        run: |
          git apply --check diagnostic-inputs/.github/diagnostics/sandbox-homes.patch
          git apply diagnostic-inputs/.github/diagnostics/sandbox-homes.patch
          git diff --check
          sha256sum -c measured/source-hashes.txt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install diff-cover
        run: pip install 'diff-cover>=9.2.0'
      - name: Project changed-line coverage gate
        run: bash scripts/ci/self-hosted/diff-cover.sh measured/lcov 6c8c7ad93f1a66067c22bff382b9ddcf306294cd ci-out/diff-cover
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sandbox-rust-homes-coverage
          path: ci-out/
          retention-days: 14
  native-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    container:
      image: ghcr.io/tinyhumansai/openhuman_ci@sha256:c3c20d625bcc9f75e50c3c2c2b75c88d3e60a3f4352b0f19f5327b490438722d
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_MIN_STACK: '67108864'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6c8c7ad93f1a66067c22bff382b9ddcf306294cd
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-inputs
          persist-credentials: false
      - name: Prepare exact source and canonical dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/ci/checkout-submodules.sh
          pnpm install --frozen-lockfile
          mkdir -p ci-out
          git apply --check diagnostic-inputs/.github/diagnostics/sandbox-homes.patch
          git apply diagnostic-inputs/.github/diagnostics/sandbox-homes.patch
          git diff --check
          git diff --binary > ci-out/applied.patch
          cmp ci-out/applied.patch diagnostic-inputs/.github/diagnostics/sandbox-homes.patch
          sha256sum crates/openhuman-core/src/sandbox/ops.rs crates/openhuman-core/src/sandbox/ops_tests.rs > ci-out/source-hashes.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: ci-fast-rust-cov
          cache-on-failure: false
      - name: Install canonical test modules
        run: bash scripts/ci/self-hosted/install-test-modules.sh "/opt/openhuman-test-modules/${GITHUB_RUN_ID}-sandbox" ci-out/test-modules.env
      - name: Whole-workspace Rust formatting
        run: |
          bash scripts/ci-cancel-aware.sh cargo fmt --all --check 2>&1 | tee ci-out/full-rust-format.log
          bash scripts/ci-cancel-aware.sh cargo fmt --manifest-path crates/openhuman-app/Cargo.toml --all --check 2>&1 | tee ci-out/tauri-rust-format.log
      - name: Changed core crate Clippy
        run: |
          set -a
          source ci-out/test-modules.env
          set +a
          unset RUSTFLAGS
          FEATURES="$(bash scripts/ci/product-features.sh)"
          bash scripts/ci-cancel-aware.sh cargo clippy --features "$FEATURES" -p openhuman --lib -- -D warnings 2>&1 | tee ci-out/core-clippy.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sandbox-rust-homes-lint
          path: ci-out/
          retention-days: 14
